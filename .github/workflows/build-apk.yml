name: Build Starry Pages APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'starry-pages-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk starry-pages-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: starry-pages-debug-apk
          path: starry-pages-debug.apk
      - name: Commit APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add starry-pages-debug.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build Starry Pages APK [skip ci]"
          git push
