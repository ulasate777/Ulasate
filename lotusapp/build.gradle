plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ktg.whitelotus'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ktg.whitelotus'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
